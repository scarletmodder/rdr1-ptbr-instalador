name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check the tag against main, VERSION and the notes
        shell: pwsh
        run: |
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'The tag commit is not on main.' }
          $version = (Get-Content -Raw VERSION).Trim()
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw "Tag $env:GITHUB_REF_NAME differs from v$version" }
          if (-not (Test-Path -LiteralPath "docs/releases/$env:GITHUB_REF_NAME.md")) { throw 'The release notes are missing' }
      - name: Guard, with the whole history
        shell: pwsh
        run: python scripts/guard.py --root . --history
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco upgrade innosetup --version="6.7.1" --allow-downgrade -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'choco could not install Inno Setup' }
      - name: Build
        shell: powershell
        run: ./scripts/build.ps1
      - name: Installer tests
        shell: powershell
        run: ./tests/test-installer.ps1
      - name: Build the release notes
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $sums = (Get-Content -Raw dist/SHA256SUMS.txt).Trim()
          $body = (Get-Content -Raw -Encoding utf8 "docs/releases/$tag.md").TrimEnd() + "`n`n## SHA-256`n`n``````text`n$sums`n```````n"
          [IO.File]::WriteAllText('dist/notes.md', $body)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package
          if-no-files-found: error
          path: |
            dist/Instalador-*
            dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: notes
          if-no-files-found: error
          path: dist/notes.md

  publish:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package
          path: package
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: notes
          path: notes
      - name: Check the package contents
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $expected = @('SHA256SUMS.txt', "Instalador-Dublagem-PTBR-RDR1-$tag.exe", "Instalador-Dublagem-PTBR-RDR1-Linux-$tag.zip") | Sort-Object
          $list = @(Get-ChildItem -Recurse -File package | ForEach-Object { [IO.Path]::GetRelativePath('package', $_.FullName).Replace('\', '/') } | Sort-Object)
          $list | ForEach-Object { Write-Host $_ }
          if (($list -join '|') -cne ($expected -join '|')) { throw "The package should have exactly: $($expected -join ', ')" }
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag "package/Instalador-Dublagem-PTBR-RDR1-$tag.exe" "package/Instalador-Dublagem-PTBR-RDR1-Linux-$tag.zip" package/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --title "Instalador da dublagem PT-BR do Red Dead Redemption $tag" --notes-file notes/notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
