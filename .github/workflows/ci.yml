name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Guard, with the whole history
        shell: pwsh
        run: python scripts/guard.py --root . --history
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco upgrade innosetup --version="6.7.1" --allow-downgrade -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'choco could not install Inno Setup' }
      - name: Build
        shell: powershell
        run: ./scripts/build.ps1
      - name: Installer tests
        shell: powershell
        run: ./tests/test-installer.ps1
      - name: Windows script tests, through the .cmd launchers
        shell: powershell
        run: ./tests/test-scripts.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer
          if-no-files-found: error
          path: |
            dist/Instalador-*
            dist/SHA256SUMS.txt
